titre: Poulet croustillant sauce teriyaki
cuisine: asiatique
origine: Japon
type: plat
resume: "Des cuisses ouvertes à plat, cuites côté peau en partant d'une poêle froide jusqu'à ce qu'elles craquent, avec une sauce teriyaki maison aux oignons fondants."
portions:
  base: 2

ingredients:
  - groupe: Le poulet
    items:
      - { nom: Cuisses de poulet avec la peau, qte: 2, note: désossées ou à désosser }
      - { nom: Sel, qte: 2, unite: pincee }
      - { nom: Huile de tournesol, qte: 2, unite: cs }
  - groupe: La sauce teriyaki aux oignons
    items:
      - { nom: Oignon, qte: 0.5 }
      - { nom: Saké de cuisine, qte: 1, unite: cs }
      - { nom: Mirin, qte: 2, unite: cs }
      - { nom: Sauce soja, qte: 2, unite: cs, note: "type Kikkoman, ou sauce soja claire" }
      - { nom: Eau, qte: 2, unite: cs }
      - { nom: Sucre, qte: 1, unite: cs }
      - { nom: Poivre }
      - { nom: Shichimi togarashi, qte: 1, unite: pincee, mode: chef, optionnel: true, note: mélange japonais de sept épices }

simple:
  temps: { preparation: 10, cuisson: 30 }
  etapes:
    - "Mélanger le mirin, la sauce soja, l'eau et le sucre. Émincer l'oignon."
    - "Désosser les cuisses si besoin et les ouvrir à plat. Saler les deux faces."
    - texte: "Les poser côté peau dans une poêle froide avec l'huile, puis allumer à feu moyen. Cuire sans les retourner, environ 18 min, jusqu'à ce que la peau soit dorée et croustillante."
      minuteur: 1080
    - texte: "Retourner, retirer un peu d'huile et cuire 4 min côté chair. Réserver, peau vers le haut."
      minuteur: 240
    - texte: "Ne garder qu'une cuillère d'huile dans la poêle. Faire revenir l'oignon 40 s, ajouter le saké 10 s, puis la sauce et du poivre à feu doux, 2 min 30."
      minuteur: 150
    - "Servir le poulet avec la sauce autour, pas sur la peau."

chef:
  temps: { preparation: 15, cuisson: 30 }
  etapes:
    - titre: La sauce
      texte: "Mélanger le mirin, la sauce soja, l'eau et le sucre. Émincer finement l'oignon."
    - titre: Ouvrir les cuisses
      texte: "Entailler les cuisses le long de l'os pour le retirer et les ouvrir à plat. Entailler légèrement les parties épaisses de la chair : la cuisson sera homogène, sans parties sèches. Garder la peau, c'est elle qui deviendra croustillante. Saler les deux faces d'une pincée de sel."
    - titre: Partir à froid
      texte: "Verser l'huile dans une poêle froide, y poser les cuisses côté peau, bien à plat, puis allumer à feu moyen. La graisse de la peau fond doucement et la fait dorer sans brûler. Soulever de temps en temps les morceaux pour que l'huile passe dessous. Compter environ 18 min, selon le feu."
      minuteur: 1080
    - titre: Côté chair
      texte: "Retourner, retirer un peu d'huile pour que la chair dore sans frire, et cuire 4 min. Déposer sur une grille, peau vers le haut."
      minuteur: 240
    - titre: Les oignons
      texte: "Ne garder qu'une cuillère à soupe d'huile. Feu moyen : l'oignon 40 s, il se charge des sucs du poulet. Ajouter le saké et remuer 10 s : l'alcool s'évapore et laisse son parfum."
    - titre: Réduire
      texte: "Feu doux, verser la sauce et poivrer. Remuer de temps en temps pendant 2 min 30 : la sauce s'épaissit légèrement."
      minuteur: 150
    - titre: Le service
      texte: "Un morceau de poulet par assiette, peau vers le haut, la sauce aux oignons tout autour sans arroser la peau. Une pincée de shichimi si on aime."
  astuces:
    - "Ouvrir et entailler les cuisses, partir à froid, retirer l'excédent d'huile, servir la sauce autour : ce sont les quatre gestes du croustillant."
    - "La sauce teriyaki du carnet, plus riche, peut remplacer celle-ci."

sources:
  - titre: "Cuisse de poulet croustillante sauce teriyaki aux oignons, Cooking With Morgane (YouTube)"
    url: https://www.youtube.com/watch?v=VWFlQ1EOxMk
voirAussi: [sauce-teriyaki]

assiette:
  - role: feculent
    choix: [riz-blanc]
    defaut: [riz-blanc]
  - role: legume
    choix: [legumes-sautes-wok, salade-concombre-wakame]
    defaut: [legumes-sautes-wok]
