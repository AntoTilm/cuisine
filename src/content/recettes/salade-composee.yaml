titre: Salade composée
cuisine: francaise
type: accompagnement
saison: ete
resume: La salade de brasserie qui accompagne la viande et les frites, avec une vinaigrette à la moutarde montée minute.
portions:
  base: 4

ingredients:
  - groupe: La salade
    items:
      - { nom: Laitue ou batavia, qte: 1 }
      - { nom: Tomates, qte: 3 }
      - { nom: Concombre, qte: 0.5 }
      - { nom: Oignon rouge, qte: 0.5 }
      - { nom: Œufs, qte: 2, mode: chef, note: durs }
      - { nom: Radis, qte: 6, mode: chef }
      - { nom: Pain de campagne, qte: 2, unite: tranche, mode: chef, note: pour les croûtons }
      - { nom: Beurre, qte: 15, unite: g, mode: chef }
  - groupe: La vinaigrette
    items:
      - { nom: Moutarde de Dijon, qte: 1, unite: cc }
      - { nom: Vinaigre de vin rouge, qte: 1, unite: cs }
      - { nom: Huile d'olive, qte: 3, unite: cs }
      - { nom: Échalote, qte: 1, mode: chef }
      - { nom: Ciboulette, qte: 0.5, unite: botte }
      - { nom: Sel }
      - { nom: Poivre }

simple:
  temps: { preparation: 15, cuisson: 0 }
  etapes:
    - "Laver et essorer la salade. Couper les tomates en quartiers, le concombre en demi-rondelles et l'oignon rouge en lamelles fines."
    - "Dans le fond du saladier, mélanger la moutarde, le vinaigre, le sel et le poivre, puis l'huile en fouettant."
    - "Ajouter les légumes et la ciboulette ciselée, mais ne mélanger qu'au moment de servir : la salade ne doit pas attendre dans la vinaigrette."

chef:
  temps: { preparation: 25, cuisson: 10 }
  etapes:
    - titre: Les œufs
      texte: "Cuire les œufs 10 min à l'eau bouillante, les refroidir dans l'eau glacée et les écaler."
      minuteur: 600
    - titre: Les croûtons
      texte: "Couper le pain en dés et les dorer au beurre dans une poêle, 4 à 5 min, en remuant. Saler légèrement."
      minuteur: 270
    - titre: Les légumes
      texte: "Laver et bien essorer la salade : une feuille mouillée dilue la vinaigrette. Tailler les tomates en quartiers, le concombre en demi-rondelles, les radis en rondelles fines et l'oignon rouge en lamelles. Ciseler l'échalote et la ciboulette."
    - titre: La vinaigrette
      texte: "Dans le fond du saladier, dissoudre le sel dans le vinaigre (il ne fond pas dans l'huile), ajouter la moutarde et l'échalote, puis l'huile en filet en fouettant pour émulsionner. Poivrer."
    - titre: Le service
      texte: "Mettre la salade et les légumes sur la vinaigrette, mélanger à la main au dernier moment, puis poser les œufs en quartiers, les croûtons et la ciboulette."
