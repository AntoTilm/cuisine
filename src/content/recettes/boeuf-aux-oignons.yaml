titre: Bœuf aux oignons
cuisine: asiatique
origine: Chine
type: plat
resume: "Un grand classique chinois avec très peu d'ingrédients : du bœuf mariné à la sauce d'huître, saisi au wok avec beaucoup d'oignons fondants."
portions:
  base: 4

ingredients:
  - groupe: La marinade
    items:
      - { nom: Bœuf tendre, qte: 600, unite: g, note: "rumsteck, bavette ou filet", mode: simple }
      - { nom: Bœuf tendre, qte: 500, unite: g, note: "rumsteck, bavette ou filet", mode: chef }
      - { nom: Farine de blé, qte: 10, unite: g, mode: simple }
      - { nom: Sel, qte: 0.5, unite: cc, mode: simple }
      - { nom: Sel, qte: 2, unite: pincee, mode: chef }
      - { nom: Sauce d'huître, qte: 2, unite: cs, mode: simple }
      - { nom: Sauce d'huître, qte: 0.5, unite: cs, mode: chef, cle: huitremarinade }
      - { nom: Sauce soja foncée, qte: 2, unite: cs, mode: simple }
      - { nom: Sauce soja foncée, qte: 1, unite: cs, mode: chef, cle: sojamarinade }
      - { nom: Sauce soja claire, qte: 0.5, unite: cs, mode: chef, cle: sojaclaire }
      - { nom: Bicarbonate alimentaire, qte: 1, unite: cc, mode: chef, cle: bicarbonate }
      - { nom: Fécule de maïs, qte: 1, unite: cs, mode: chef, cle: fecule }
      - { nom: Huile de tournesol, qte: 2, unite: cs, mode: simple, cle: huilemarinade }
      - { nom: Huile de tournesol, qte: 1, unite: cs, mode: chef, cle: huilemarinadechef }
      - { nom: Huile de sésame grillé, qte: 0.5, unite: cs, mode: chef, cle: sesame }
  - groupe: La cuisson
    items:
      - { nom: Oignons, qte: 500, unite: g, mode: simple }
      - { nom: Oignons, qte: 350, unite: g, mode: chef, note: "environ 3" }
      - { nom: Ciboule chinoise ou oignon vert, qte: 1, mode: chef }
      - { nom: Ail, qte: 4, unite: gousse, mode: chef }
      - { nom: Huile de tournesol, qte: 4, unite: cs, mode: simple, cle: huilecuisson }
      - { nom: Huile de tournesol, qte: 1, unite: cs, mode: chef, cle: huileoignons }
      - { nom: Huile de tournesol, qte: 3, unite: cs, mode: chef, cle: huileboeuf }
      - { nom: Alcool de riz Shaoxing, qte: 2, unite: cs, mode: chef, cle: shaoxing }
      - { nom: Sauce soja foncée, qte: 1, unite: cs, mode: chef, cle: sojacuisson }
      - { nom: Sauce d'huître, qte: 0.5, unite: cs, mode: chef, cle: huitrecuisson }
      - { nom: Eau, qte: 8, unite: cl, mode: chef, rayon: divers, cle: eau }
      - { nom: Poivre moulu }

simple:
  temps: { preparation: 15, cuisson: 8, attente: 20 }
  etapes:
    - "Trancher finement le bœuf. Le mélanger avec le sel, la sauce soja foncée, la sauce d'huître, {huilemarinade} d'huile et la farine. Laisser mariner 20 min au frais."
    - "Couper les oignons en quartiers, puis séparer les pétales."
    - texte: "Chauffer {huilecuisson} d'huile dans un wok à feu très fort. Y sauter les oignons 2 à 3 min."
      minuteur: 150
    - texte: "Détacher les morceaux de bœuf, les ajouter aux oignons et sauter 2 à 3 min en remuant sans arrêt. Poivrer et servir aussitôt."
      minuteur: 150

chef:
  temps: { preparation: 25, cuisson: 8 }
  etapes:
    - titre: Trancher
      texte: "Passer le bœuf 30 min au congélateur : il se tranche plus facilement. Le couper en tranches fines, perpendiculairement aux fibres : les fibres restent courtes et la viande tendre."
    - titre: Assaisonner
      texte: "Mélanger le bœuf avec {sojaclaire} de sauce soja claire, {sojamarinade} de sauce soja foncée, {huitremarinade} de sauce d'huître, une pincée de sel et du poivre. Bien malaxer."
    - titre: Attendrir
      texte: "Délayer {bicarbonate} de bicarbonate dans 1 c. à soupe d'eau (il ne se dissout pas entièrement, c'est normal) et l'incorporer à la viande en malaxant. C'est le secret des restaurants chinois pour une viande très tendre."
    - titre: Enrober
      texte: "Ajouter {fecule} de fécule de maïs et mélanger : elle forme une couche qui garde le jus dans la viande. Terminer par {huilemarinadechef} d'huile de tournesol et {sesame} d'huile de sésame, mélangées sans presser. Pas besoin d'attendre : la marinade agit pendant qu'on prépare le reste."
    - titre: Les légumes
      texte: "Couper les oignons en deux puis en gros morceaux, sans séparer les couches. Séparer le blanc de la ciboule (émincé, il cuira avec les oignons) du vert (en tronçons, pour la fin). Hacher l'ail."
    - titre: Les oignons
      texte: "Chauffer le wok à feu fort jusqu'à ce qu'il soit très chaud, ajouter {huileoignons} d'huile, puis les oignons, le blanc de ciboule et une pincée de sel. Sauter 3 min 30 en remuant régulièrement : le sel leur fait rendre leur eau, ils deviennent souples mais restent un peu croquants. Réserver."
      minuteur: 210
    - titre: Saisir le bœuf
      texte: "Dans le même wok, à feu vif, bien chauffer {huileboeuf} d'huile. Ajouter l'ail, puis le bœuf étalé en une seule couche. Laisser saisir 30 s sans toucher, puis retourner."
      minuteur: 30
    - titre: Déglacer
      texte: "Verser {shaoxing} d'alcool de riz Shaoxing sur les bords chauds du wok et remuer 20 s. Ajouter de même {sojacuisson} de sauce soja foncée et {huitrecuisson} de sauce d'huître, remuer 20 s."
      minuteur: 40
    - titre: La sauce
      texte: "Verser {eau} d'eau et remuer 30 s : la fécule de la marinade la fait épaissir et napper la viande."
      minuteur: 30
    - titre: Rassembler
      texte: "Remettre les oignons, ajouter le vert de ciboule et un tour de poivre. Remuer 20 s, éteindre et servir tout de suite, avec un riz long parfumé."
      minuteur: 20
  astuces:
    - "L'ordre de la marinade compte : assaisonnements, puis bicarbonate, puis fécule, et l'huile en dernier pour enrober le tout."
    - "Oignons et bœuf cuisent séparément : chacun garde sa texture, et le wok reste assez chaud pour saisir la viande au lieu de la faire bouillir."
    - "Verser l'alcool et les sauces sur les bords du wok : ils grésillent, caramélisent un peu et parfument davantage."
    - "Pour 6 personnes ou plus, saisir le bœuf en deux fois."

sources:
  - titre: "Bœuf aux oignons, Cooking With Morgane (YouTube)"
    url: https://www.youtube.com/watch?v=kSAhmnt5UaE
  - titre: "Bœuf aux oignons ultra tendre, les secrets de la cuisine chinoise, Cooking With Morgane (YouTube)"
    url: https://www.youtube.com/watch?v=2BVlKUVKXUY

assiette:
  - role: feculent
    choix: [riz-blanc, riz-cantonais]
    defaut: [riz-blanc]
  - role: legume
    choix: [legumes-sautes-wok, salade-concombre-wakame]
